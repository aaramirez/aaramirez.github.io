title: Alexander A. Ramírez M.
description: >-
  Tecnología, telecomunicaciones, matemáticas y finanzas: cursos interactivos, artículos
  y el CV de Alexander A. Ramírez M.
url: https://aaramirez.github.io
baseurl: ""
lang: es
timezone: America/Caracas

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

# Las URL de los artículos no cambian: /categoría/.../título.html
permalink: none
future: true

collections:
  posts:
    output: true

include:
  - _pages

# Páginas sueltas que ya no funcionan (ejemplos en CodePen, demos de terceros):
# se dejan en el repositorio pero no se publican.
exclude:
  - cursos/ionic-css
  - wowbook
  - sample-template-master
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: inner
  - scope:
      path: ""
      type: pages
    values:
      layout: inner
